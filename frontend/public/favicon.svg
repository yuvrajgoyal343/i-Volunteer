<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="ivBrandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="ivGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#047857" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#ivBrandGrad)" filter="url(#shadow)" />

  <!-- Subtle Top Sheen -->
  <path d="M2 18 C2 9.163 9.163 2 18 2 L46 2 C54.837 2 62 9.163 62 18 L62 28 L2 28 Z" fill="url(#ivGloss)" />

  <!-- White Monogram iV -->
  <text 
    x="32" 
    y="44" 
    text-anchor="middle" 
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" 
    font-size="34" 
    font-weight="900" 
    letter-spacing="-1.5" 
    fill="#ffffff"
    style="user-select: none;"
  >iV</text>
</svg>